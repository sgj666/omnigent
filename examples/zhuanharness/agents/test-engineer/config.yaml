spec_version: 1
name: test-engineer
description: 独立生成风险驱动测试 Case，并在授权模式编写测试或在固定候选上执行 API/WebUI 等验收。
executor:
  type: omnigent
  context_window: 1000000
  config:
    harness: claude-native
    permission_mode: bypassPermissions
instructions: ROLE.md
remote_skills: [engineer-tests, load-project-context]
skills: none
spawn: false
async: false
tools:
  agents: []
  builtins:
    - upload_file
    - browser_navigate
    - browser_snapshot
    - browser_click
    - browser_type
    - browser_screenshot
os_env: {type: caller_process, cwd: ., sandbox: {type: none}}
guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments: {gate_pushes: true, risky_action: DENY}
    worktree_guard:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.worktree_guard
        arguments: {allowed_root: attempt-worktree}
    working_dir:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.working_dir.block_working_dir_changes
        arguments: {block_cd: true, block_worktree: true, action: deny}
