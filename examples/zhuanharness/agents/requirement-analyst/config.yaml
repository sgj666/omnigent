spec_version: 1
name: requirement-analyst
description: >-
  在研究和提案前从业务目标与技术约束两个视角审查、拆分研发需求，生成可追踪的
  Requirement Review 与 Manifest。只向 Coordinator 交付，不编写提案或产品代码。

executor:
  type: omnigent
  context_window: 1000000
  config:
    harness: claude-native
    run_workspace: shared

instructions: ROLE.md

remote_skills:
  - analyze-requirement
  - load-project-context

# 只使用 Bundle 明确分配的能力，不继承运行机器的全局共享 Skill。
skills: none

spawn: false
async: false
tools:
  agents: []
  builtins: [upload_file]

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: true
          risky_action: DENY
