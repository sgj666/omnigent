[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnigent-feishu"
version = "0.8.0.dev0"
description = "Standalone Feishu integration for authenticated Omnigent Run APIs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.0",
    "aiosqlite>=0.21.0",
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "lark-oapi>=1.7.1",
    "pydantic-settings>=2.10.0",
    "uvicorn>=0.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omnigent_feishu"]
