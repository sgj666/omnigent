<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Orvia dimensional target lock mark</title>
  <desc id="desc">A perspective arrow flies from the foreground and strikes the center of a spectral twin-orbit target.</desc>
  <defs>
    <linearGradient id="coolOrbit" x1="126" y1="374" x2="388" y2="134" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#83DDC4"/><stop offset="0.2" stop-color="#59D8EC"/><stop offset="0.48" stop-color="#70A6FA"/><stop offset="0.74" stop-color="#927CF1"/><stop offset="1" stop-color="#D887D2"/></linearGradient>
    <linearGradient id="warmOrbit" x1="388" y1="134" x2="126" y2="374" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#D887D2"/><stop offset="0.3" stop-color="#F1A095"/><stop offset="0.58" stop-color="#F1C891"/><stop offset="0.8" stop-color="#A7DEAD"/><stop offset="1" stop-color="#59D8EC"/></linearGradient>
    <linearGradient id="shaft" x1="76" y1="436" x2="252" y2="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F5D59D"/><stop offset="0.38" stop-color="#F1A095"/><stop offset="0.72" stop-color="#D887D2"/><stop offset="1" stop-color="#927CF1"/></linearGradient>
    <linearGradient id="shaftHighlight" x1="93" y1="415" x2="242" y2="267" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF2D2" stop-opacity="0.78"/><stop offset="1" stop-color="#F0C7FF" stop-opacity="0.16"/></linearGradient>
    <linearGradient id="arrowHead" x1="218" y1="294" x2="258" y2="254" gradientUnits="userSpaceOnUse"><stop stop-color="#C379E1"/><stop offset="1" stop-color="#7E6FE9"/></linearGradient>
    <radialGradient id="targetFace" cx="0" cy="0" r="1" gradientTransform="translate(244 242) rotate(45) scale(59)" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="0.62" stop-color="#F3EFFF"/><stop offset="1" stop-color="#D8CFF6"/></radialGradient>
    <radialGradient id="impact" cx="0" cy="0" r="1" gradientTransform="translate(256 256) rotate(90) scale(17)" gradientUnits="userSpaceOnUse"><stop stop-color="#5145A2" stop-opacity="0.64"/><stop offset="0.46" stop-color="#7F6DD1" stop-opacity="0.3"/><stop offset="1" stop-color="#927CF1" stop-opacity="0"/></radialGradient>
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#172131" flood-opacity="0.18"/></filter>
    <filter id="targetShadow" x="-50%" y="-50%" width="200%" height="210%"><feDropShadow dx="3" dy="7" stdDeviation="6" flood-color="#3C315F" flood-opacity="0.22"/></filter>
    <filter id="arrowShadow" x="-30%" y="-30%" width="180%" height="190%"><feDropShadow dx="7" dy="9" stdDeviation="6" flood-color="#291F49" flood-opacity="0.28"/></filter>
  </defs>

  <g filter="url(#ringShadow)">
    <circle cx="256" cy="256" r="166" pathLength="1000" fill="none" stroke="url(#warmOrbit)" stroke-width="58" stroke-linecap="round" stroke-dasharray="476 524" transform="rotate(-40 256 256)"/>
    <circle cx="256" cy="256" r="166" pathLength="1000" fill="none" stroke="url(#coolOrbit)" stroke-width="58" stroke-linecap="round" stroke-dasharray="476 524" transform="rotate(140 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="41" fill="url(#targetFace)" stroke="#FFFFFF" stroke-opacity="0.78" stroke-width="3" filter="url(#targetShadow)"/>
  <circle cx="256" cy="256" r="25" fill="none" stroke="#9988DE" stroke-opacity="0.38" stroke-width="8"/>
  <circle cx="256" cy="256" r="14" fill="url(#impact)"/>

  <g filter="url(#arrowShadow)">
    <!-- Perspective shaft: wider in the lower-left foreground, narrower at impact. -->
    <path d="M77 421L93 437L240 286L229 275Z" fill="url(#shaft)"/>
    <path d="M87 417L93 423L235 281L231 277Z" fill="url(#shaftHighlight)"/>
    <!-- Front-facing fletching gives the near end scale and direction. -->
    <path d="M78 423L49 398L69 389L106 409Z" fill="#F1C891"/>
    <path d="M89 434L114 463L123 442L104 407Z" fill="#E9A890"/>
    <path d="M57 399L70 397L98 413L86 420Z" fill="#FFE8B7" opacity="0.64"/>
    <!-- The head remains above the target face while the tip enters the impact point. -->
    <path d="M214 269L244 299L258 254Z" fill="url(#arrowHead)" stroke="#A977DA" stroke-width="2" stroke-linejoin="round"/>
    <path d="M228 274L243 289L253 260Z" fill="#E1B2F1" opacity="0.34"/>
  </g>
  <!-- Contact lip partially occludes the tip to create a pierced surface. -->
  <path d="M247 263A13 13 0 0 1 263 247" fill="none" stroke="#5E50A7" stroke-opacity="0.48" stroke-width="5" stroke-linecap="round"/>
</svg>
